[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dream-intelligence"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = ["fastapi>=0.115,<1", "uvicorn>=0.30,<1", "SQLAlchemy>=2.0,<2.1", "pydantic>=2.9,<3", "feedparser>=6.0.11,<7", "beautifulsoup4>=4.12,<5", "APScheduler>=3.10,<4", "httpx>=0.27,<1", "pypdf>=6,<7", "playwright>=1.55,<2"]

[project.optional-dependencies]
test = ["httpx>=0.27,<1"]

[tool.setuptools.packages.find]
include = ["app*"]
